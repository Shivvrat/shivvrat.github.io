services:
  site:
    build: .
    image: shivvrat-jekyll
    ports:
      - "${PERSONAL_SITE_PORT:-${PORT:-4000}}:4000"
      - "${PERSONAL_SITE_LIVERELOAD_PORT:-${LIVERELOAD_PORT:-35729}}:35729"
    volumes:
      - .:/srv/jekyll
    environment:
      BUNDLE_FROZEN: "1"
    command:
      - sh
      - -c
      - |
        echo "Local URL: http://localhost:${PERSONAL_SITE_PORT:-${PORT:-4000}}"
        bundle exec jekyll serve --config _config.yml,_config_docker.yml --livereload --trace --force_polling
