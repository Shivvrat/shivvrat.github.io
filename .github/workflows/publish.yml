name: Publish website

# One build per push: build, check internal links (blocking), then deploy.
# A broken internal link stops the deploy.

on:
  push:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build site
        uses: ./.github/actions/build-site

      - name: Internal links (blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --offline
            --config lychee.toml
            --root-dir ${{ github.workspace }}/_site
            --fallback-extensions html
            --no-progress
            '_site/**/*.html'

      - name: Publish site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: master
          folder: _site
          clean: true
